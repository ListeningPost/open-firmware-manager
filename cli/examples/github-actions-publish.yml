# Private GitHub repo → signed release on your AT Protocol PDS.
# Sidekar polls the channel pointer. No inbound deploy webhook.
#
# Setup:
#   1. Copy to .github/workflows/open-firmware-publish.yml
#   2. Edit OFW_SOURCE_REPO below (replace YOUR_ORG) and PRODUCT/CHANNEL/KIND.
#   3. Create two GitHub environments so the two identities never share a job:
#        ofw-publisher     vars: OFW_PDS, OFW_IDENTIFIER   secret: OFW_PASSWORD
#        ofw-ci-attester   vars: OFW_PDS, OFW_IDENTIFIER   secret: OFW_PASSWORD
#      The attester must be a different account from the publisher. Use an app
#      password, and add required reviewers to ofw-publisher if you want a
#      human gate. Sidekar should set OFW_ATTESTER_DIDS to the attester DID.
#   4. Adjust the build and test steps.
#
# Job layout (least privilege):
#   build    no credentials; builds the artifact and the ofw CLI
#   publish  publisher credentials; writes the release (gate=awaiting-pipeline)
#   attest   attester credentials only; runs tests and writes pipeline acks
#   promote  publisher credentials; promotes the gate from the attester's acks
#
# Credentials reach ofw through environment variables only (OFW_PDS,
# OFW_IDENTIFIER, OFW_PASSWORD); nothing secret is placed on a command line.
# ofw publish --json writes a single JSON object to stdout
# (rkey, uri, cid, gate, authorDid).

name: Open Firmware publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version (if not tagging)"
        required: false

permissions:
  contents: read

concurrency:
  group: open-firmware-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # ── Edit these ──────────────────────────────────────────────────────
  # Where to install the ofw CLI from when this repo has no ./cli directory.
  OFW_SOURCE_REPO: https://github.com/YOUR_ORG/open-firmware
  # Optional: pin the CLI to a commit SHA (recommended for production).
  OFW_SOURCE_REV: ""
  PRODUCT: my-app
  CHANNEL: stable
  KIND: container
  STAGES: build,test
  # ────────────────────────────────────────────────────────────────────
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve and validate version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$INPUT_VERSION"
          fi
          if [[ -z "$V" ]]; then
            echo "::error::version required (tag v* or workflow_dispatch input)"
            exit 1
          fi
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$V" =~ $SEMVER ]]; then
            echo "::error::version is not valid semver"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build container image
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Docker tags cannot contain '+'.
          TAG="${PRODUCT}:${VERSION//+/_}"
          docker build -t "$TAG" .
          docker save "$TAG" -o image.tar

      - name: Build ofw CLI
        run: |
          if [[ "$OFW_SOURCE_REPO" == *YOUR_ORG* && ! -d cli ]]; then
            echo "::error::edit OFW_SOURCE_REPO at the top of this workflow"
            exit 1
          fi
          if [[ -d cli ]]; then
            cargo install --locked --path cli --root "$RUNNER_TEMP/ofw"
          else
            REV=()
            if [[ -n "$OFW_SOURCE_REV" ]]; then REV=(--rev "$OFW_SOURCE_REV"); fi
            cargo install --locked --git "$OFW_SOURCE_REPO" "${REV[@]}" --bin ofw --root "$RUNNER_TEMP/ofw"
          fi
          cp "$RUNNER_TEMP/ofw/bin/ofw" ./ofw

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ofw-cli
          path: ofw
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact
          path: image.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ofw-publisher
    outputs:
      rkey: ${{ steps.publish.outputs.rkey }}
      authorDid: ${{ steps.publish.outputs.authorDid }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - name: Publish immutable release (gate=awaiting-pipeline)
        id: publish
        env:
          OFW_PDS: ${{ vars.OFW_PDS }}
          OFW_IDENTIFIER: ${{ vars.OFW_IDENTIFIER }}
          OFW_PASSWORD: ${{ secrets.OFW_PASSWORD }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          chmod +x ./ofw
          OUT=$(./ofw publish \
            --product "$PRODUCT" \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --kind "$KIND" \
            --file ./image.tar \
            --platform linux/amd64 \
            --require-pipeline \
            --stages "$STAGES" \
            --yes \
            --json)
          echo "$OUT"
          RKEY=$(printf '%s\n' "$OUT" | jq -er .rkey)
          GATE=$(printf '%s\n' "$OUT" | jq -er .gate)
          AUTHOR=$(printf '%s\n' "$OUT" | jq -er .authorDid)
          echo "rkey=$RKEY" >> "$GITHUB_OUTPUT"
          echo "authorDid=$AUTHOR" >> "$GITHUB_OUTPUT"
          test "$GATE" = "awaiting-pipeline"

  attest:
    # Independent CI attester: this job never sees the publisher password.
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ofw-ci-attester
    outputs:
      actor: ${{ steps.ack.outputs.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ofw-cli

      - name: Run tests
        run: echo "run your real test suite here; a failure must stop this job"

      - name: Ack build + test
        id: ack
        env:
          OFW_PDS: ${{ vars.OFW_PDS }}
          OFW_IDENTIFIER: ${{ vars.OFW_IDENTIFIER }}
          OFW_PASSWORD: ${{ secrets.OFW_PASSWORD }}
          OFW_AUTHOR_DID: ${{ needs.publish.outputs.authorDid }}
          RKEY: ${{ needs.publish.outputs.rkey }}
        run: |
          chmod +x ./ofw
          ACTOR=""
          IFS=',' read -ra STAGE_LIST <<< "$STAGES"
          for STAGE in "${STAGE_LIST[@]}"; do
            ACK=$(./ofw pipeline-ack \
              --rkey "$RKEY" \
              --author-did "$OFW_AUTHOR_DID" \
              --stage "$STAGE" \
              --result passed \
              --run-url "$RUN_URL" \
              --commit "$GITHUB_SHA" \
              --json)
            echo "$ACK"
            ACTOR=$(printf '%s\n' "$ACK" | jq -er .actor)
          done
          if [[ "$ACTOR" == "$OFW_AUTHOR_DID" ]]; then
            echo "::error::attester and publisher are the same account; the attester must be independent"
            exit 1
          fi
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"

  promote:
    needs: [publish, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ofw-publisher
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ofw-cli
      - name: Promote gate + channel from acks
        env:
          OFW_PDS: ${{ vars.OFW_PDS }}
          OFW_IDENTIFIER: ${{ vars.OFW_IDENTIFIER }}
          OFW_PASSWORD: ${{ secrets.OFW_PASSWORD }}
          RKEY: ${{ needs.publish.outputs.rkey }}
          ATTESTER_DID: ${{ needs.attest.outputs.actor }}
        run: |
          chmod +x ./ofw
          ./ofw pipeline-promote \
            --rkey "$RKEY" \
            --attester-did "$ATTESTER_DID" \
            --json
