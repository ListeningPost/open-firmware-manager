# Private GitHub repo → signed release on your AT Protocol PDS.
# Sidekar polls the channel pointer. No inbound deploy webhook.
#
# Setup:
#   1. Copy to .github/workflows/open-firmware-publish.yml
#   2. Secrets (publisher): OFW_PDS, OFW_IDENTIFIER, OFW_PASSWORD
#   3. Optional independent CI attester: OFW_CI_IDENTIFIER, OFW_CI_PASSWORD
#      When set, acks are written by the CI account; the publisher then
#      pipeline-promote. Sidekar should set OFW_ATTESTER_DIDS to that CI DID.
#   4. Adjust product, build, artifact path
#
# ofw publish --json writes a single JSON object to stdout (rkey, uri, cid, gate, authorDid).

name: Open Firmware publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version (if not tagging)"
        required: false

env:
  PRODUCT: my-app
  CHANNEL: stable
  KIND: container

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          if [[ -z "$V" ]]; then
            echo "version required (tag v* or workflow_dispatch input)" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          docker build -t "${{ env.PRODUCT }}:${{ steps.ver.outputs.version }}" .
          docker save "${{ env.PRODUCT }}:${{ steps.ver.outputs.version }}" -o image.tar

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build ofw CLI
        run: |
          if [[ -d cli ]]; then
            cargo install --path cli --root "$HOME/.local"
          else
            cargo install --git https://github.com/YOUR_ORG/open-firmware --bin ofw --root "$HOME/.local"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish immutable release (gate=awaiting-pipeline)
        id: publish
        env:
          OFW_PDS: ${{ secrets.OFW_PDS }}
          OFW_IDENTIFIER: ${{ secrets.OFW_IDENTIFIER }}
          OFW_PASSWORD: ${{ secrets.OFW_PASSWORD }}
        run: |
          OUT=$(ofw publish \
            --product "${{ env.PRODUCT }}" \
            --version "${{ steps.ver.outputs.version }}" \
            --channel "${{ env.CHANNEL }}" \
            --kind "${{ env.KIND }}" \
            --file ./image.tar \
            --platform linux/amd64 \
            --require-pipeline \
            --stages build,test \
            --yes \
            --json)
          echo "$OUT"
          RKEY=$(printf '%s\n' "$OUT" | jq -er .rkey)
          GATE=$(printf '%s\n' "$OUT" | jq -er .gate)
          AUTHOR=$(printf '%s\n' "$OUT" | jq -er .authorDid)
          echo "rkey=$RKEY" >> "$GITHUB_OUTPUT"
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          echo "authorDid=$AUTHOR" >> "$GITHUB_OUTPUT"
          test "$GATE" = "awaiting-pipeline"

      - name: Ack build + test
        id: ack
        env:
          OFW_PDS: ${{ secrets.OFW_PDS }}
          OFW_IDENTIFIER: ${{ secrets.OFW_CI_IDENTIFIER || secrets.OFW_IDENTIFIER }}
          OFW_PASSWORD: ${{ secrets.OFW_CI_PASSWORD || secrets.OFW_PASSWORD }}
          AUTHOR_DID: ${{ steps.publish.outputs.authorDid }}
        run: |
          echo "run your real test suite here"
          ACK_ID="${{ secrets.OFW_CI_IDENTIFIER }}"
          AUTHOR_FLAG=()
          if [[ -n "$ACK_ID" ]]; then
            AUTHOR_FLAG=(--author-did "$AUTHOR_DID")
          fi
          BUILD=$(ofw pipeline-ack \
            --rkey "${{ steps.publish.outputs.rkey }}" \
            "${AUTHOR_FLAG[@]}" \
            --stage build \
            --result passed \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --json)
          echo "$BUILD"
          TEST=$(ofw pipeline-ack \
            --rkey "${{ steps.publish.outputs.rkey }}" \
            "${AUTHOR_FLAG[@]}" \
            --stage test \
            --result passed \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --json)
          echo "$TEST"
          ACTOR=$(printf '%s\n' "$TEST" | jq -er .actor)
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"

      - name: Promote gate + channel from acks
        env:
          OFW_PDS: ${{ secrets.OFW_PDS }}
          OFW_IDENTIFIER: ${{ secrets.OFW_IDENTIFIER }}
          OFW_PASSWORD: ${{ secrets.OFW_PASSWORD }}
        run: |
          ofw pipeline-promote \
            --rkey "${{ steps.publish.outputs.rkey }}" \
            --attester-did "${{ steps.ack.outputs.actor }}" \
            --json
