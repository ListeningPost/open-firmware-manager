version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images are pinned by digest; this keeps the digests current.
  - package-ecosystem: docker
    directories:
      - /apps/server
      - /examples/full-stack/services/*
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
