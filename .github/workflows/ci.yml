name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @open-firmware/core test
      - run: pnpm --filter @open-firmware/iot test
      - run: pnpm --filter @open-firmware/core build
      - run: pnpm --filter @open-firmware/atproto-lite build
      - run: pnpm --filter @open-firmware/iot build
      - run: pnpm --filter @open-firmware/host build
      - run: pnpm --filter @open-firmware/client build
      - run: pnpm --filter @open-firmware/sidekar build
      - run: pnpm --filter @open-firmware/utility build
      - run: pnpm --filter @open-firmware/server build
      - run: pnpm --filter @open-firmware/iot-camera-emulator test:e2e

  rust-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path cli/Cargo.toml
      - run: cargo build --release --manifest-path cli/Cargo.toml
